* {

}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Full-screen GIF background */

.animation-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.animation-screen img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
}

/* Optional subtle cinematic fade */

.animation-screen {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="animation-screen">

    <img
        src="apollo11animation.gif"
        alt="Apollo 11 zooming towards the Moon's surface"
    >

</div>

<script>

// Display animation for 6 seconds

}, 6000);

</script>
