
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apollo 11 | Lunar Approach</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* Full-screen GIF background */

.animation-screen {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.animation-screen img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
}

/* Optional subtle cinematic fade */

.animation-screen {
    animation: fadeIn 1s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="animation-screen">

    <img
        src="apollo11animation.gif"
        alt="Apollo 11 zooming towards the Moon's surface"
    >

</div>

<script>

// Display animation for 6 seconds

setTimeout(function() {

    window.location.href = "apolloinfo.html";

}, 6000);

</script>

<!-- Background Music -->
<audio id="backgroundMusic" loop>
    <source src="space.mp3" type="audio/mpeg">
</audio>

<!-- Music Control -->
<button id="musicToggle">🔊 Music On</button>

<style>
#musicToggle {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 9999;
    padding: 10px 15px;
    border: 1px solid white;
    border-radius: 25px;
    background: rgba(10, 20, 45, 0.85);
    color: white;
    cursor: pointer;
    font-size: 13px;
}
</style>

<script>
const music = document.getElementById("backgroundMusic");
const button = document.getElementById("musicToggle");

music.volume = 0.3;

// Restore previous playback position
const savedTime = localStorage.getItem("musicTime");
const wasPlaying = localStorage.getItem("musicPlaying");

if (savedTime) {
    music.currentTime = parseFloat(savedTime);
}

// Save playback position
music.addEventListener("timeupdate", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

// Play music after visitor interaction
button.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        localStorage.setItem("musicPlaying", "true");
        button.innerHTML = "🔊 Music On";
    } else {
        music.pause();
        localStorage.setItem("musicPlaying", "false");
        button.innerHTML = "🔇 Music Off";
    }
});

// Continue music on the next page
if (wasPlaying === "true") {
    music.play().catch(() => {
        button.innerHTML = "🔇 Tap for Music";
    });
}
</script>


</body>
</html>
