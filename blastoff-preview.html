<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postcards from the Moon: Explore the Moon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { height: 100%; margin: 0; background: #04103a; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: 'Pixelify Sans', 'Courier New', monospace; }

  /* 16:9 stage that scales to any screen. 1cqw = 1% of the stage width */
  .stage { position: relative; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9;
           container-type: inline-size; overflow: hidden; background: #04103a; }

  /* ---------- Stars ---------- */
  .star { position: absolute; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  .star.dot { width: .35cqw; height: .35cqw; }
  .star.plus { width: 1.1cqw; height: 1.1cqw; background: none; }
  .star.plus::before, .star.plus::after { content: ""; position: absolute; background: #fff; }
  .star.plus::before { left: 0; right: 0; top: 40%; height: 20%; }
  .star.plus::after  { top: 0; bottom: 0; left: 40%; width: 20%; }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ---------- 3D canvas ---------- */
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  #gl.grab { cursor: grab; } #gl.grabbing { cursor: grabbing; } #gl.point { cursor: pointer; }

  /* ---------- Text, robot, bubbles ---------- */
  .hint { position: absolute; left: 70%; width: 25%; top: 33%; text-align: center; color: #fff;
          font-size: 1.5cqw; line-height: 1.5; pointer-events: none; text-shadow: .15cqw .15cqw 0 #04103a; }

  .robot { position: absolute; left: 16.3%; top: 78.5%; width: 7.8%; image-rendering: pixelated; pointer-events: none;
           opacity: 0; transform: translateY(2cqw); transition: opacity .6s, transform .6s; }
  .robot.show { opacity: 1; transform: none; }
  .robot img { width: 100%; display: block; animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-.7cqw) rotate(3deg); } }

  /* Both messages sit in the SAME spot beside Luna; only one is visible at a time */
  .bubble { position: absolute; left: 27.5%; bottom: 7.5%; width: 28%; box-sizing: border-box;
            background: #fff; color: #111; text-align: center; font-size: 1.6cqw; line-height: 1.45;
            padding: 1.6cqw 1.8cqw; border: .5cqw solid #000; border-radius: .4cqw;
            box-shadow: -.7cqw .7cqw 0 #8f8f8f; pointer-events: none;
            opacity: 0; transform: scale(.92); transform-origin: 10% 100%; transition: opacity .2s steps(3), transform .2s steps(3); }
  .bubble.show { opacity: 1; transform: none; }
  .bubble::before, .bubble::after { content: ""; position: absolute; }
  .bubble::before { left: 12%; bottom: -3.1cqw; width: 2.6cqw; height: 2.6cqw; background: #000;
                    clip-path: polygon(0 0, 100% 0, 100% 35%, 70% 35%, 70% 65%, 35% 65%, 35% 100%, 0 100%); }
  .bubble::after  { left: calc(12% + .5cqw); bottom: -1.9cqw; width: 1.6cqw; height: 1.6cqw; background: #fff;
                    clip-path: polygon(0 0, 100% 0, 100% 40%, 60% 40%, 60% 70%, 30% 70%, 30% 100%, 0 100%); }

  /* ---------- Apollo 11 hover label ---------- */
  .tip { position: absolute; left: 0; top: 0; transform: translate(-50%, -190%); background: #fff; color: #111;
         border: .35cqw solid #000; padding: .5cqw 1.1cqw; font-size: 1.5cqw; white-space: nowrap;
         box-shadow: -.3cqw .3cqw 0 #8f8f8f; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 5; }
  .tip.show { opacity: 1; }

  /* ---------- Home button ---------- */
  .btn { position: absolute; font-family: inherit; text-decoration: none; color: #111; text-align: center;
         border: .2cqw solid #111; cursor: pointer; }
  .btn:hover, .btn:focus-visible { outline: .3cqw solid #fff; outline-offset: .2cqw; }
  #home { left: .9%; top: 2.3%; width: 25.6%; height: 6.5%; background: #fff; border-radius: 1.6cqw; z-index: 10;
          display: flex; align-items: center; justify-content: center; gap: .7cqw; font-weight: 600; font-size: 1.8cqw; white-space: nowrap; }
  #home svg { width: 2.4cqw; height: 2.4cqw; }
</style>
</head>

  <div class="bubble" id="b1">Look at that! We’re finally on the Moon. Our adventure begins!</div>
  <div class="bubble" id="b2">“Let’s start with where it all began! Click on the Apollo 11 landing site to explore humanity’s first Moon landing!”</div>
</div>

<script>
  // ====== Settings you may want to change ======
  const APOLLO_PAGE = 'apollo11.html';          // page opened when the red pin is clicked
  const APOLLO = { lat: 0.67, lon: 23.47 };     // Apollo 11 landing site (Sea of Tranquility)

  // ====== Background stars ======
  let seed = 11; const rnd0 = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = document.getElementById('sky');
  function addStar(cls, n) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'star ' + cls;
      el.style.left = rnd0() * 98 + '%'; el.style.top = rnd0() * 98 + '%';
      el.style.animationDelay = (rnd0() * 3) + 's'; el.style.animationDuration = (2 + rnd0() * 3) + 's';
      sky.appendChild(el);
    }
  }
  addStar('dot', 110); addStar('plus', 22);

  // ====== Luna and the two messages (same spot, one after the other) ======
  const wait = ms => new Promise(r => setTimeout(r, ms));
  (async function story() {
    await wait(500);
    document.getElementById('robot').classList.add('show');
    document.getElementById('b1').classList.add('show');      // 1st message appears...
    await wait(3000);                                          // ...stays for 3 seconds...
    document.getElementById('b1').classList.remove('show');   // ...then the 2nd takes its place
    await wait(250);
    document.getElementById('b2').classList.add('show');
  })();

  // ====== Moon surface texture (drawn with code, so no image file is needed) ======
  function makeMoonTexture() {
    const W = 2048, H = 1024;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    let s = 20240711;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s);
                        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const X = lon => (lon + 180) / 360 * W, Y = lat => (90 - lat) / 180 * H;

    g.fillStyle = '#9b9b9b'; g.fillRect(0, 0, W, H);

    // soft light/dark mottling
    for (let i = 0; i < 260; i++) {
      const x = rnd() * W, y = rnd() * H, r = 40 + rnd() * 160, v = rnd() < .5 ? 255 : 0;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${v},${v},${v},.07)`); gr.addColorStop(1, `rgba(${v},${v},${v},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }

    // dark "seas" (maria): [lon, lat, half-width deg, half-height deg]
    const maria = [[-17,34,14,9],[-52,12,12,16],[18,28,8,6],[31,8,10,7],[59,17,5,4],
                   [52,-4,7,6],[34,-15,4,4],[-15,-21,8,6],[-39,-24,4,4],[0,58,18,3]];
    maria.forEach(([lon, lat, rx, ry]) => {
      for (let k = 0; k < 6; k++) {
        const jx = lon + (rnd() - .5) * rx * .7, jy = lat + (rnd() - .5) * ry * .7, f = .7 + rnd() * .6;
        g.save(); g.translate(X(jx), Y(jy)); g.scale(rx * f / 360 * W, ry * f / 180 * H);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
        gr.addColorStop(0, 'rgba(62,62,68,.55)'); gr.addColorStop(.65, 'rgba(70,70,76,.42)'); gr.addColorStop(1, 'rgba(70,70,76,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill(); g.restore();
      }
    });

    // craters
    function crater(lon, lat, rDeg, a) {
      const sx = 1 / Math.max(Math.cos(lat * Math.PI / 180), .22);
      const rx = rDeg / 360 * W * sx, ry = rDeg / 180 * H, cy = Y(lat);
      [0, -W, W].forEach(off => {
        const cx = X(lon) + off; if (cx + rx < 0 || cx - rx > W) return;
        g.save(); g.translate(cx, cy); g.scale(rx, ry);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, 1);
        gr.addColorStop(0, `rgba(40,40,40,${.34 * a})`); gr.addColorStop(.7, `rgba(60,60,60,${.18 * a})`);
        gr.addColorStop(.86, 'rgba(0,0,0,0)'); gr.addColorStop(.94, `rgba(255,255,255,${.22 * a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill(); g.restore();
      });
    }
    for (let i = 0; i < 3200; i++) {
      const lat = Math.asin(rnd() * 2 - 1) * 180 / Math.PI, lon = rnd() * 360 - 180;
      crater(lon, lat, .3 + Math.pow(rnd(), 4) * 5.5, .6 + rnd() * .6);
    }
    for (let i = 0; i < 14; i++) crater(rnd() * 360 - 180, Math.asin(rnd() * 1.6 - .8) * 180 / Math.PI, 6 + rnd() * 3, .8);

    // bright ray craters (Tycho, Copernicus, Kepler, Aristarchus, Proclus)
    [[-11.4,-43.3],[-20,9.6],[-38,8],[-47.5,23.7],[47,16]].forEach(([lon, lat]) => {
      const cx = X(lon), cy = Y(lat);
      const gr = g.createRadialGradient(cx, cy, 0, cx, cy, 34);
      gr.addColorStop(0, 'rgba(255,255,255,.75)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, 34, 0, 7); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.13)'; g.lineWidth = 1.4;
      for (let k = 0; k < 30; k++) {
        const ang = rnd() * 6.283, len = (6 + rnd() * 16) / 360 * W;
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len * .8); g.stroke();
      }
    });

    // fine grain
    const img = g.getImageData(0, 0, W, H), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 14; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
    g.putImageData(img, 0, 0);
    return c;
  }

  // ====== 3D scene ======
  const stage = document.getElementById('stage');
  const glCanvas = document.getElementById('gl');
  const tip = document.getElementById('tip');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true }); }
  catch (e) { document.getElementById('hint').textContent = 'Your browser could not start the 3D Moon.'; throw e; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 16 / 9, 0.1, 100);
  camera.position.set(0, 0, 6.2);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85); sun.position.set(-3, 3, 5); scene.add(sun);

  const tex = new THREE.CanvasTexture(makeMoonTexture());
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const moonMat = new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 1.6, roughness: 1, metalness: 0 });
  const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), moonMat);
  moon.position.set(0, 0.41, 0);
  scene.add(moon);

  // Optional: put a real Moon map named moon.jpg next to this page and it replaces the drawn one
  new THREE.TextureLoader().load('moon.jpg', t => {
    t.anisotropy = tex.anisotropy; moonMat.map = t; moonMat.bumpMap = t; moonMat.needsUpdate = true;
  }, undefined, () => {});

  // lat/lon -> point on the sphere (same mapping three.js uses for its sphere textures)
  function latLonToVec(lat, lon) {
    const phi = (lon + 180) / 360 * Math.PI * 2, theta = (90 - lat) / 180 * Math.PI;
    return new THREE.Vector3(-Math.cos(phi) * Math.sin(theta), Math.cos(theta), Math.sin(phi) * Math.sin(theta));
  }

  // The single red pin: Apollo 11
  const n = latLonToVec(APOLLO.lat, APOLLO.lon);
  const pin = new THREE.Group();
  pin.position.copy(n).multiplyScalar(0.995);
  pin.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.3, 12),
                                new THREE.MeshStandardMaterial({ color: 0xcfcfd6, roughness: .4, metalness: .6 }));
  needle.position.y = 0.15;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 28, 18),
                              new THREE.MeshStandardMaterial({ color: 0xd8200f, emissive: 0x4a0600, roughness: .28, metalness: .1 }));
  head.position.y = 0.34;
  const hit = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 8), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.y = 0.3;
  pin.add(needle, head, hit);
  moon.add(pin);

  // Start with the pin visible at the upper left of the Moon
  moon.quaternion.setFromUnitVectors(n, new THREE.Vector3(-0.2, 0.55, 0).setZ(Math.sqrt(1 - 0.04 - 0.3025)).normalize());

  // ====== Sizing ======
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // ====== Drag to rotate (with a little spin after you let go) ======
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), q = new THREE.Quaternion(), axis = new THREE.Vector3();
  let dragging = false, moved = 0, last = { x: 0, y: 0 }, vel = { x: 0, y: 0 };

  function rotateBy(dx, dy) {
    const len = Math.hypot(dx, dy); if (!len) return;
    axis.set(dy, dx, 0).normalize();
    q.setFromAxisAngle(axis, len / glCanvas.clientHeight * 2.8);
    moon.quaternion.premultiply(q);
  }
  function aim(e) {
    const r = glCanvas.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
  }
  function overPin() {                    // true only if the pin is facing us and not hidden behind the Moon
    const h = ray.intersectObject(hit, false)[0]; if (!h) return false;
    const m = ray.intersectObject(moon, false)[0];
    return !(m && m.distance < h.distance);
  }
  function overMoon() { return ray.intersectObject(moon, false).length > 0; }

  glCanvas.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; vel.x = vel.y = 0; last = { x: e.clientX, y: e.clientY };
    glCanvas.setPointerCapture(e.pointerId); glCanvas.className = 'grabbing'; tip.classList.remove('show');
  });
  glCanvas.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      moved += Math.hypot(dx, dy); rotateBy(dx, dy); vel.x = dx; vel.y = dy; last = { x: e.clientX, y: e.clientY };
      return;
    }
    aim(e);
    if (overPin()) { glCanvas.className = 'point'; tip.classList.add('show'); hovering = true; }
    else { glCanvas.className = overMoon() ? 'grab' : ''; tip.classList.remove('show'); hovering = false; }
  });
  glCanvas.addEventListener('pointerup', e => {
    if (!dragging) return; dragging = false; glCanvas.className = 'grab';
    aim(e);
    if (moved < 6 && overPin()) window.location.href = APOLLO_PAGE;     // a click (not a drag) on the red pin
  });
  glCanvas.addEventListener('pointerleave', () => { if (!dragging) { tip.classList.remove('show'); hovering = false; } });

  // ====== Animation loop ======
  let hovering = false, t0 = performance.now();
  const v = new THREE.Vector3();
  function frame(now) {
    if (!dragging && Math.hypot(vel.x, vel.y) > 0.05) { rotateBy(vel.x, vel.y); vel.x *= 0.95; vel.y *= 0.95; }
    const pulse = hovering ? 1.3 : 1 + 0.08 * Math.sin((now - t0) / 280);   // the pin gently pulses
    head.scale.setScalar(pulse);
    renderer.render(scene, camera);
    if (tip.classList.contains('show')) {                                    // keep the label above the pin
      head.getWorldPosition(v); v.project(camera);
      tip.style.left = ((v.x * .5 + .5) * glCanvas.clientWidth) + 'px';
      tip.style.top  = ((-v.y * .5 + .5) * glCanvas.clientHeight) + 'px';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
