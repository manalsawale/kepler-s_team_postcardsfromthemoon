<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Postcards from the Moon: Apollo 11</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Special+Elite&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #04103a; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden;
         font-family: 'Pixelify Sans', 'Courier New', monospace; }

  /* 16:9 stage that scales to any screen. 1cqw = 1% of the stage width */
  .stage { position: relative; width: min(100vw, 100vh * 16 / 9); aspect-ratio: 16 / 9;
           container-type: inline-size; overflow: hidden; background: #04103a; }

  /* ---------- Stars ---------- */
  .star { position: absolute; background: #fff; animation: twinkle 3s ease-in-out infinite; }
  .star.dot { width: .35cqw; height: .35cqw; }
  .star.plus { width: 1.1cqw; height: 1.1cqw; background: none; }
  .star.plus::before, .star.plus::after { content: ""; position: absolute; background: #fff; }
  .star.plus::before { left: 0; right: 0; top: 40%; height: 20%; }
  .star.plus::after  { top: 0; bottom: 0; left: 40%; width: 20%; }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

  /* ---------- Postcard ---------- */
  .card { position: absolute; left: 8.3%; top: 10.5%; width: 83.5%; height: 44.7cqw;
          background:
            radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 55%),
            radial-gradient(ellipse at 80% 90%, rgba(150,110,50,.18), transparent 60%),
            #f3e4c0;
          box-shadow: 0 .8cqw 2.2cqw rgba(0,0,0,.45);
          color: #3b332c; font-family: 'Special Elite', 'Courier New', monospace;
          transform: rotate(-3.5deg); opacity: 0;
          animation: zoomIn 2.8s cubic-bezier(.3,.7,.2,1) .3s forwards; }
  @keyframes zoomIn {
    0%   { transform: scale(.1) rotate(0deg);   opacity: 0; }
    30%  { transform: scale(1.7) rotate(0deg);  opacity: 1; }
    45%  { transform: scale(1.7) rotate(0deg);  opacity: 1; }
    100% { transform: scale(1) rotate(-3.5deg); opacity: 1; }
  }

  /* Airmail border (red and blue slanted stripes) */
  .edge { position: absolute; }
  .edge.t, .edge.b { left: 0; right: 0; height: 1.9cqw;
    background: repeating-linear-gradient(110deg, #c8312f 0 3.2cqw, transparent 3.2cqw 4.4cqw, #3f64a8 4.4cqw 7.6cqw, transparent 7.6cqw 8.8cqw); }
  .edge.l, .edge.r { top: 0; bottom: 0; width: 1.9cqw;
    background: repeating-linear-gradient(160deg, #c8312f 0 3.2cqw, transparent 3.2cqw 4.4cqw, #3f64a8 4.4cqw 7.6cqw, transparent 7.6cqw 8.8cqw); }
  .edge.t { top: 0; } .edge.b { bottom: 0; } .edge.l { left: 0; } .edge.r { right: 0; }

  /* Text on the card */
  .txt { position: absolute; left: 6.2%; right: 3.5%; margin: 0; white-space: pre-wrap; }
  .hid { visibility: hidden; }
  #title { top: 6%; font-size: 4cqw; line-height: 1.05; letter-spacing: .1cqw; color: #4a403a; font-weight: 400; text-transform: uppercase; }
  #sub1  { top: 25%; font-size: 1.9cqw; }
  #sub2  { top: 32%; font-size: 1.9cqw; }
  #dear  { top: 40%; font-size: 2.3cqw; }
  #body  { top: 47.5%; font-size: 1.42cqw; line-height: 1.62; }
  #body p { margin: 0; }
  #bye   { top: 79.5%; left: auto; right: 3.8%; text-align: right; font-size: 2cqw; line-height: 1.5; }
  #foot  { bottom: 3.4%; left: 0; right: 0; text-align: center; font-size: 1.9cqw; }

  /* Stamps and postmark */
  .stamp, .postmark { position: absolute; }
  #stamp1 { left: 63.5%; top: 5.5%; width: 16.2%; filter: drop-shadow(.1cqw .15cqw .2cqw rgba(0,0,0,.35)); }
  #stamp2 { left: 82%;   top: 5.5%; width: 14.6%; filter: drop-shadow(.1cqw .15cqw .2cqw rgba(0,0,0,.3)); }
  .postmark { left: 74.5%; top: 15%; width: 15.6%; opacity: .7; }
  .stamp svg, .postmark svg { width: 100%; display: block; }

  /* ---------- Buttons ---------- */
  .btn { position: absolute; font-family: inherit; text-decoration: none; color: #111; text-align: center;
         border: .2cqw solid #111; cursor: pointer; }
  .btn:hover, .btn:focus-visible { outline: .3cqw solid #fff; outline-offset: .2cqw; }
  #home { left: .9%; top: 2.3%; width: 25.6%; height: 6.5%; background: #fff; border-radius: 1.6cqw;
          display: flex; align-items: center; justify-content: center; gap: .7cqw; font-weight: 600; font-size: 1.8cqw; white-space: nowrap; z-index: 10; }
  #home svg { width: 2.4cqw; height: 2.4cqw; }

  /* Starts as a small grey block, then grows into the "Blast off to moon!" button */
  #blast { left: 41.7%; top: 73%; width: 18.7%; height: 5.2cqw; z-index: 6; box-sizing: border-box;
           background: #bdbdc4; border: 0; font-size: 1.9cqw; pointer-events: none;
           display: flex; align-items: center; justify-content: center; white-space: nowrap;
           transform-origin: 50% 50%; transform: scale(.32, .63);
           transition: transform .6s steps(6); }
  #blast.grown { transform: none; border: .3cqw solid #111; pointer-events: auto;
                 box-shadow: inset .25cqw .25cqw 0 #e8e8ee, inset -.25cqw -.25cqw 0 #7d7d8a; }
  #blast:active { box-shadow: inset -.25cqw -.25cqw 0 #e8e8ee, inset .25cqw .25cqw 0 #7d7d8a; }

  @media (prefers-reduced-motion: reduce) { .star { animation: none; opacity: .8; } }
</style>
</head>
<body>
<div class="stage">
  <div id="sky"></div>

  <a class="btn" id="home" href="index.html" aria-label="Return to Home Screen">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#111" d="M8 1h1v1h1v1h1v1h1v1h1v1h1v1h-2v7H3V7H1V6h1V5h1V4h1V3h1V2h1V1z"/></svg>
    Return to Home Screen
  </a>

  <div class="card" id="card">
    <div class="edge t"></div><div class="edge b"></div><div class="edge l"></div><div class="edge r"></div>

    <!-- Stamp 1 (6c) -->
    <div class="stamp" id="stamp1">
      <svg viewBox="0 0 160 190" aria-hidden="true">
        <rect x="2" y="2" width="156" height="186" fill="#f6f2e8"/>
        <rect x="4" y="4" width="152" height="182" fill="none" stroke="#f3e4c0" stroke-width="6" stroke-dasharray="5 5"/>
        <circle cx="80" cy="70" r="52" fill="#1f4fb0"/>
        <ellipse cx="80" cy="70" rx="62" ry="17" transform="rotate(-28 80 70)" fill="none" stroke="#fff" stroke-width="1.4" opacity=".8"/>
        <g fill="#fff" opacity=".9"><circle cx="40" cy="48" r="1.4"/><circle cx="116" cy="96" r="1.4"/><circle cx="54" cy="104" r="1.2"/><circle cx="108" cy="40" r="1.2"/><circle cx="90" cy="108" r="1.2"/></g>
        <path d="M22 100 C 68 72 110 42 152 16 C 120 54 74 86 22 100 Z" fill="#e0342a"/>
        <text x="80" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#fff">NASA</text>
        <text x="80" y="152" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#e0342a" letter-spacing="-3">NASA</text>
        <text x="22" y="178" font-family="Arial, sans-serif" font-weight="700" font-size="17" fill="#1f4fb0">6c</text>
        <text x="46" y="178" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#1f4fb0">U.S. POSTAGE</text>
      </svg>
    </div>

    <!-- Stamp 2 (14c) -->
    <div class="stamp" id="stamp2">
      <svg viewBox="0 0 150 170" aria-hidden="true">
        <rect x="2" y="2" width="146" height="166" fill="#eadfc4"/>
        <rect x="4" y="4" width="142" height="162" fill="none" stroke="#f3e4c0" stroke-width="6" stroke-dasharray="5 5"/>
        <circle cx="75" cy="62" r="46" fill="#5575ad"/>
        <path d="M24 88 C 62 66 98 40 140 20 C 108 52 66 78 24 88 Z" fill="#b9b9c4" opacity=".9"/>
        <text x="75" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" fill="#fff" opacity=".9">NASA</text>
        <text x="75" y="126" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="40" fill="#d8483a" letter-spacing="-3">NASA</text>
        <text x="20" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#5575ad">14c</text>
        <text x="42" y="152" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#5575ad">U.S. POSTAGE</text>
      </svg>
    </div>

    <!-- Postmark -->
    <div class="postmark">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <path id="arcTop" d="M 22 104 A 78 78 0 0 1 178 104"/>
          <path id="arcBot" d="M 30 120 A 74 74 0 0 0 170 120"/>
        </defs>
        <circle cx="100" cy="100" r="92" fill="none" stroke="#3b3b3b" stroke-width="3"/>
        <circle cx="100" cy="100" r="62" fill="none" stroke="#3b3b3b" stroke-width="1.5" opacity=".6"/>
        <text font-family="Special Elite, monospace" font-size="19" fill="#3b3b3b" letter-spacing="2"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">LOS ANGELES</textPath></text>
        <text font-family="Special Elite, monospace" font-size="19" fill="#3b3b3b" letter-spacing="2"><textPath href="#arcBot" startOffset="50%" text-anchor="middle">CALIF.</textPath></text>
        <g font-family="Special Elite, monospace" font-size="22" fill="#3b3b3b" text-anchor="middle">
          <text x="100" y="82">JUL</text><text x="100" y="105">12</text><text x="100" y="128">4 PM</text><text x="100" y="151">1940</text>
        </g>
      </svg>
    </div>

    <!-- Typed text -->
    <h1 class="txt" id="title"></h1>
    <p class="txt" id="sub1"></p>
    <p class="txt" id="sub2"></p>
    <p class="txt" id="dear"></p>
    <div class="txt" id="body"><p id="p1"></p><p id="p2"></p><p id="p3"></p></div>
    <p class="txt" id="bye"></p>
    <p class="txt" id="foot"></p>
  </div>

  <!-- Change href to the page this button should open -->
  <a class="btn" id="blast" href="blastoff.html" aria-label="Blast off to moon!"></a>
</div>

<script>
  // ----- Stars (stable layout) -----
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sky = document.getElementById('sky');
  function addStar(cls, n) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div'); el.className = 'star ' + cls;
      el.style.left = rnd() * 98 + '%'; el.style.top = rnd() * 98 + '%';
      el.style.animationDelay = (rnd() * 3) + 's'; el.style.animationDuration = (2 + rnd() * 3) + 's';
      sky.appendChild(el);
    }
  }
  addStar('dot', 110); addStar('plus', 22);

  // ----- Typewriter (reserves the space first so lines don't jump around) -----
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function type(id, text, speed) {
    const el = document.getElementById(id);
    el.innerHTML = '<span></span><span class="hid"></span>';
    const [shown, rest] = el.children;
    rest.textContent = text;
    for (const ch of text) {
      shown.textContent += ch;
      rest.textContent = rest.textContent.slice(1);
      await wait(speed);
    }
    rest.remove();
  }

  (async function play() {
    const blast = document.getElementById('blast');
    await wait(2300);                       // postcard zooms in and settles
    await type('title', 'Postcards\nfrom the Moon', 40);
    await type('sub1', 'Sr. 1  GREETINGS FROM THE MOON', 22);
    await type('sub2', 'Apollo 11 \u00B7 Sea of Tranquility \u00B7 20 July 1969', 22);
    blast.classList.add('grown');           // grey block grows into the button
    await wait(500);
    blast.textContent = 'Blast off to moon!';
    await type('dear', 'Dear Earth,', 45);
    await type('p1', 'We made it! After a four-day journey, I carried humanity\u2019s first footsteps onto the Moon. Neil Armstrong and Buzz Aldrin explored the lunar surface while Michael Collins orbited above.', 18);
    await type('p2', 'Built on the discoveries of robotic pioneers like Surveyor 3, our mission turned a distant dream into reality.', 18);
    await type('p3', '\u201CThere\u2019s a place for you among the stars. Join me on this unforgettable lunar adventure!\u201D', 18);
    await type('bye', 'With lunar love,\nApollo 11\uD83D\uDE80', 40);
    await type('foot', 'One small step for man, one giant leap for mankind.', 28);
  })();
</script>
</body>
</html>
