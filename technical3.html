<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EASEP (separate) &amp; Retroreflector – Apollo 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#051134;overflow:hidden}
  #stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh*1022/680));aspect-ratio:1022/680;container-type:inline-size;overflow:hidden}
  #bg{width:100%;height:100%;display:block}
  #home{position:absolute;left:0.8%;top:0.3%;width:25.8%;height:5%;border-radius:12px;cursor:pointer}
  #home:hover{outline:3px solid #ffe27a}

  /* clickable sprites (invisible buttons placed exactly over the pictures) */
  .spot{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;
        border-radius:6px;outline:none;transition:box-shadow .12s}
  .spot:hover,.spot:focus-visible{box-shadow:0 0 0 .3cqw #ffe27a inset}
  .spot.sel{box-shadow:0 0 0 .35cqw #ffe27a inset,0 0 2cqw rgba(255,226,122,.55)}

  #hint{position:absolute;left:0;right:0;top:82.5%;text-align:center;color:#fff;
        font:500 1.6cqw "Pixelify Sans","Courier New",monospace}
  /* Next button (same look as the "explore more" button) */
  #next{position:absolute;right:2.5%;top:60%;width:16%;box-sizing:border-box;padding:.5cqw .6cqw;
        text-align:center;text-decoration:none;color:#000;cursor:pointer;
        font:700 2.2cqw/1.2 "Pixelify Sans","Courier New",monospace;
        background:linear-gradient(#fff 0 45%,#bdbdbd 45% 100%);
        border:.4cqw solid #000;box-shadow:.5cqw .5cqw 0 #555}
  #next:hover,#next:focus-visible{background:linear-gradient(#ffe27a 0 45%,#d9b84a 45% 100%);outline:none}
  #next:active{transform:translate(.3cqw,.3cqw);box-shadow:.2cqw .2cqw 0 #555}
  /* info box styled like the two boxes at the top */
  #info{position:absolute;left:6%;width:88%;top:79.5%;box-sizing:border-box;display:none;
        background:#fff;color:#000;border:.4cqw solid #000;border-radius:.7cqw;
        box-shadow:.8cqw .8cqw 0 #8c8c8c;padding:.7cqw 1.4cqw 1cqw;
        font:500 1.55cqw/1.35 "Pixelify Sans","Courier New",monospace}
  #info.on{display:block;animation:pop .25s steps(4)}
  #info h2{margin:0 0 .3cqw;font:700 1.9cqw "Pixelify Sans","Courier New",monospace}
  #info .rest{visibility:hidden}
  #info::before{content:"";position:absolute;top:-1.15cqw;left:var(--px,50%);width:1.5cqw;height:1.5cqw;margin-left:-.75cqw;
        background:#fff;border-left:.4cqw solid #000;border-top:.4cqw solid #000;transform:rotate(45deg)}
  @keyframes pop{from{transform:translateY(1cqw);opacity:0}to{transform:none;opacity:1}}

  #intro{position:absolute;left:45.8%;top:1.7%;width:51.4%;height:8.3%;display:flex;align-items:center;
         color:#000;font:500 1.32cqw/1.4 "Pixelify Sans","Courier New",monospace;pointer-events:none}
  .lbl{position:absolute;transform:translateX(-50%);white-space:nowrap;pointer-events:none;color:#fff;
       font:500 1.7cqw "Pixelify Sans","Courier New",monospace;
       text-shadow:-.15cqw 0 #051134,.15cqw 0 #051134,0 -.15cqw #051134,0 .15cqw #051134}
</style>
</head>

<script>
// ---------- The info that appears below the sprite you press ----------
const INFO={
  easep:['EASEP (separate)',"EASEP stands about 17 m south of the Lunar Module. The retroreflector is a separate object about 5 m north-northwest."],
  retro:['Retroreflector',"Designed for laser ranging, it required no electrical power. It was deployed about 5 m north-northwest of the Lunar Module, separate from the EASEP."]
};
const NEXT_PAGE='technical4.html';   // <-- filename of the page the Next button opens
document.getElementById('next').href=NEXT_PAGE;
const CPS=120;   // typing speed of the info text (characters per second)
const info=document.getElementById('info'), hint=document.getElementById('hint'),
      T=document.getElementById('t'), D=document.getElementById('d');
let cur=null, timer=null;
function type(text){
  clearInterval(timer); let n=0; const t0=performance.now();
  timer=setInterval(()=>{
    n=Math.min(text.length,Math.floor((performance.now()-t0)/1000*CPS));
    D.innerHTML='<span>'+text.slice(0,n)+'</span><span class="rest">'+text.slice(n)+'</span>';
    if(n>=text.length) clearInterval(timer);
  },16);
}
function show(id){
  document.querySelectorAll('.spot').forEach(s=>s.classList.toggle('sel',s.id===id));
  if(id===cur){ cur=null; info.classList.remove('on'); hint.style.display='block'; document.getElementById(id).classList.remove('sel'); return; }
  cur=id; const el=document.getElementById(id);
  info.style.setProperty('--px',((el.dataset.cx-6)/88*100)+'%');   // arrow points up at the sprite
  T.textContent=INFO[id][0]; type(INFO[id][1]);
  info.classList.remove('on'); void info.offsetWidth; info.classList.add('on');
  hint.style.display='none';
}
document.querySelectorAll('.spot').forEach(s=>s.addEventListener('click',()=>show(s.id)));
</script>
