<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postcards from the Moon · Luna's farewell</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--cy:#8fe9ff;--ink:#020a2d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:'VT323',ui-monospace,monospace;color:#eaf6ff}
#stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);background:radial-gradient(#06134a,var(--ink) 70%);overflow:hidden;image-rendering:pixelated;font-size:min(2.1vw,3.73vh)}
#stage canvas,#stage img{image-rendering:pixelated}
#stars,#fx{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none;z-index:9}
#earth{position:absolute;left:3%;top:4%;width:11%;filter:drop-shadow(0 0 1.2em #3b7bff88)}
#surface{position:absolute;inset:0;transition:transform 2.6s cubic-bezier(.6,0,.3,1),opacity 2.6s}
#surface.away{transform:translateY(75%);opacity:0}
#ground{position:absolute;left:0;bottom:0;width:100%}
#luna{position:absolute;left:22%;top:37%;height:33%;aspect-ratio:92/113;animation:bob 2.4s steps(4) infinite}
@keyframes bob{50%{transform:translateY(-1.2%)}}
/* hologram */
#beam{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s;z-index:3;pointer-events:none}
#holo{position:absolute;left:48%;top:7%;width:30%;height:31%;z-index:4;border:.18em solid var(--cy);background:#0a2a5a66;box-shadow:0 0 1.5em #8fe9ff55,inset 0 0 2em #8fe9ff33;opacity:0;clip-path:inset(50% 0 50% 0);transition:clip-path .45s steps(8),opacity .3s;overflow:hidden}
#holo.on{opacity:1;clip-path:inset(0)}
#holo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 .2em,#02163a55 .2em .3em);animation:scan 1.2s linear infinite;pointer-events:none}
@keyframes scan{to{background-position:0 .6em}}
#hcap{position:absolute;left:.5em;top:.2em;font-size:.9em;white-space:nowrap;color:var(--cy);letter-spacing:.08em;z-index:2}
#hc{width:100%;height:100%}
/* textbox */
#box{position:absolute;left:8%;right:8%;bottom:3%;height:21%;z-index:5;background:#050f3be8;border:.22em solid #eaf6ff;box-shadow:0 0 0 .22em #050f3b,0 0 0 .44em #8fe9ff,0 .5em 1.5em #0008;padding:.9em 1.4em;transition:opacity .6s}
#name{position:absolute;left:1em;top:-1.15em;background:#8fe9ff;color:#020a2d;padding:0 .6em;font-size:1.1em;letter-spacing:.12em}
#txt{font-size:1.55em;line-height:1.1}
#nxt{position:absolute;right:1em;bottom:.3em;color:var(--cy);animation:bl .8s steps(2) infinite;opacity:0}
@keyframes bl{50%{visibility:hidden}}
/* ending */
#moon{position:absolute;left:50%;top:104%;height:105%;aspect-ratio:1;transform:translateX(-50%);transition:top 2.8s cubic-bezier(.3,.6,.2,1);z-index:2}
#moon.up{top:47%}
#moon canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 3em #cfe3ff44,inset -2em -1em 3em #0007}
#pin{position:absolute;left:60%;top:30%;width:0;height:0}
#pin i{position:absolute;left:-.5em;top:-.5em;width:1em;height:1em;background:#ffd54a;box-shadow:0 0 .9em #ffd54a;opacity:0;transition:opacity .4s}
#pin b{position:absolute;left:-1.6em;top:-1.6em;width:3.2em;height:3.2em;border:.15em solid #ffd54a;border-radius:50%;opacity:0}
#pin.lit i{opacity:1}#pin.lit b{animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
#pin em{position:absolute;left:1.6em;top:-.7em;font-style:normal;white-space:nowrap;color:#ffe9a0;opacity:0;transition:opacity 1s}
#pin.lit em{opacity:1}
#title{position:absolute;left:0;right:0;top:15%;text-align:center;z-index:6;opacity:0;transition:opacity 1.4s}
#title.on{opacity:1}
#title h1{font-weight:400;font-size:2.6em;letter-spacing:.06em;text-shadow:0 0 .6em #8fe9ff88}
#title p{font-size:1.5em;color:#9fc4ff;margin:.2em 0 1em}
#title button{font:inherit;font-size:1.5em;color:#020a2d;background:var(--cy);border:0;padding:.3em 1.2em;cursor:pointer;box-shadow:.15em .15em 0 #3b7bff}
#title button:hover{background:#fff}
#start{position:absolute;inset:0;z-index:20;background:#020a2dee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;cursor:pointer;text-align:center}
#start h2{font-weight:400;font-size:2.6em}#start span{font-size:1.5em;color:var(--cy);animation:bl 1s steps(2) infinite}
#mute{position:absolute;right:1.2%;top:2%;z-index:15;font:inherit;font-size:1.2em;color:var(--cy);background:#050f3bcc;border:.12em solid var(--cy);padding:.1em .6em;cursor:pointer}
</style></head><body>

<script>
const $=s=>document.querySelector(s),st=$('#stage');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* ---------- audio ---------- */
let ac,mg,muted=false;
function initAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=1;mg.connect(ac.destination)}
function tone(f,d,type='square',v=.04,f2){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(mg);o.start(t);o.stop(t+d+.02)}
const blip=()=>tone(380+Math.random()*120,.06,'triangle',.011);
const chime=()=>tone(660,.9,'sine',.018);
const boot=()=>tone(300,.5,'sine',.012,520);
const spark=()=>tone(900+Math.random()*700,.2,'sine',.005);
const ping=()=>tone(660,1.4,'sine',.02);
/* ---------- starfield ---------- */
const sc=$('#stars'),sx=sc.getContext('2d');let stars=[];
function sizeStars(){sc.width=st.clientWidth;sc.height=st.clientHeight;stars=Array.from({length:150},()=>({x:Math.random()*sc.width,y:Math.random()*sc.height*.75,s:Math.random()<.15?3:2,p:Math.random()*6,k:Math.random()<.12}))}

const hc=$('#hc'),hx=hc.getContext('2d'),earthImg=$('#earth');let hk=null;
function holo(t){hx.clearRect(0,0,160,100);if(!hk)return;const C='#8fe9ff';hx.strokeStyle=C;hx.fillStyle=C;hx.lineWidth=2;
 if(hk=='signal'){for(let i=0;i<4;i++){const r=((t/40+i*14)%56);hx.globalAlpha=1-r/56;hx.beginPath();hx.arc(80,58,r,0,7);hx.stroke()}hx.globalAlpha=1;hx.fillRect(76,54,8,8)}
 if(hk=='earth'){const b=Math.sin(t/500)*2;hx.globalAlpha=.9;hx.drawImage(earthImg,40,12+b,68,68);hx.globalCompositeOperation='source-atop';hx.fillStyle='rgba(60,190,255,.55)';hx.fillRect(0,0,160,100);hx.globalCompositeOperation='source-over';hx.globalAlpha=1;}
 if(hk=='wave'){hx.beginPath();for(let x=0;x<160;x+=2){const y=55+(x>60&&x<100?Math.sin(x/3+t/120)*9*Math.sin((x-60)/40*Math.PI):0);x?hx.lineTo(x,y):hx.moveTo(x,y)}hx.stroke();hx.fillRect(0,86,160,1)}
 if(hk=='steps'){const n=Math.min(4,1+((t%6000)/700|0));for(let i=0;i<n;i++){const x=48+(i%2)*34,y=82-i*18;hx.fillRect(x,y,12,16);hx.fillRect(x+1,y-4,10,3);hx.fillRect(x+2,y-8,8,3)}}
 if(hk=='postcard'){const b=Math.sin(t/600)*2;hx.strokeRect(38,28+b,84,54);hx.beginPath();hx.moveTo(38,28+b);hx.lineTo(80,60+b);hx.lineTo(122,28+b);hx.stroke();hx.fillRect(104,34+b,10,10)}
 if(hk=='landing'){hx.fillRect(56,56,26,16);hx.fillRect(62,48,14,8);hx.beginPath();hx.moveTo(56,72);hx.lineTo(46,88);hx.moveTo(82,72);hx.lineTo(92,88);hx.moveTo(30,92);hx.lineTo(130,92);hx.moveTo(112,92);hx.lineTo(112,40);hx.stroke();hx.fillRect(112,40,20,12)}
 if(hk=='reflector'){for(let i=0;i<3;i++)for(let j=0;j<4;j++)hx.strokeRect(34+j*14,60+i*14,11,11);hx.setLineDash([4,4]);hx.lineDashOffset=-t/50;hx.beginPath();hx.moveTo(70,56);hx.lineTo(136,10);hx.stroke();hx.setLineDash([])}
 if(hk=='path'){hx.setLineDash([4,4]);hx.lineDashOffset=-t/60;hx.beginPath();hx.moveTo(20,82);hx.quadraticCurveTo(70,10,130,32);hx.stroke();hx.setLineDash([]);hx.fillStyle='#d8d8d0';hx.beginPath();hx.arc(132,32,12,0,7);hx.fill();hx.fillStyle=C;hx.fillRect(16,78,8,8)}}

const fx=$('#fx'),fc=fx.getContext('2d');let parts=[],fxOn=false;
function makeParts(){const im=$('#luna'),R=rel(im),tc=document.createElement('canvas');tc.width=im.naturalWidth;tc.height=im.naturalHeight;const g=tc.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,tc.width,tc.height).data,s=R.w/tc.width;parts=[];
 for(let y=0;y<tc.height;y++)for(let x=0;x<tc.width;x++){const i=(y*tc.width+x)*4;if(d[i+3]<128)continue;parts.push({x:R.x+x*s,y:R.y+y*s,c:[d[i],d[i+1],d[i+2]],s:s,del:y/tc.height*2.4+Math.random()*.2,vx:(Math.random()-.3)*70,vy:-(18+Math.random()*50),m:0,fly:null})}
 LR=R;im.style.visibility='hidden';return s}
let LR=null,T0=0,flying=false,pinPulse=0,done=false;
function loopFx(now){if(!fxOn)return;const t=(now-T0)/1000;fc.clearRect(0,0,fx.width,fx.height);
 const P=rel($('#pin')),sweepY=parts.length?parts[0].y:0;

  if(k>0){const e=Math.min(k,3.2);x+=p.vx*e+Math.sin(t*2+p.del*9)*4;y+=p.vy*e*(1-e/6);const m=Math.min(k/2.6,1);col=[p.c[0]+(143-p.c[0])*m|0,p.c[1]+(233-p.c[1])*m|0,255];a=.95}
  if(flying){if(p.fly==null){p.fly=now;p.fx=x;p.fy=y;p.fd=Math.random()*900}const u=Math.min(Math.max((now-p.fly-p.fd)/1400,0),1);
   if(u>0){const e=u*u*(3-2*u);x=p.fx+(P.x-p.fx)*e+Math.sin(e*3.14)*-60;y=p.fy+(P.y-p.fy)*e;if(u>=1){p.dead=true;pinPulse++;continue}}else{x=p.fx;y=p.fy}}
  fc.globalAlpha=a;fc.fillStyle=`rgb(${col})`;const sz=p.s*(k>0?.85:1);fc.fillRect(x,y,sz,sz)}
 // scanline
 if(LR&&t<2.7){fc.globalAlpha=.9;fc.fillStyle='#bff4ff';fc.fillRect(LR.x-14,LR.y+Math.min(t/2.4,1)*LR.h,LR.w+28,3)}
 requestAnimationFrame(loopFx)}

<script>
const music = document.getElementById("backgroundMusic");
const button = document.getElementById("musicToggle");

music.volume = 0.3;

// Restore previous playback position
const savedTime = localStorage.getItem("musicTime");
const wasPlaying = localStorage.getItem("musicPlaying");

if (savedTime) {
    music.currentTime = parseFloat(savedTime);
}

// Save playback position
music.addEventListener("timeupdate", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

// Play music after visitor interaction
button.addEventListener("click", () => {
    if (music.paused) {
        music.play();
        localStorage.setItem("musicPlaying", "true");
        button.innerHTML = "🔊 Music On";
    } else {
        music.pause();
        localStorage.setItem("musicPlaying", "false");
        button.innerHTML = "🔇 Music Off";
    }
});

// Continue music on the next page
if (wasPlaying === "true") {
    music.play().catch(() => {
        button.innerHTML = "🔇 Tap for Music";
    });
}
</script>
